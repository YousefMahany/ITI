  <!-- ---------------------- Fourth Project ------------------------- -->
    <h2>My Counter</h2>
  <p>Number: <span id="count">0</span></p>
  <button onclick="decrease()">-</button>
  <button onclick="increase()">+</button>

  <script>
    let count = 0;
    function increase() {
      count++;
      document.getElementById("count").innerText = count;
    }
    function decrease() {
      count--;
      document.getElementById("count").innerText = count;
    }
  </script>
